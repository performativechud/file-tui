name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        include:
          - goos: windows
            ext: .exe
          - goos: linux
            ext: ""
          - goos: darwin
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" -o file-tui${{ matrix.ext }} .

      - name: Package
        run: |
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            zip file-tui-${{ matrix.goos }}-${{ matrix.goarch }}.zip file-tui${{ matrix.ext }}
          else
            tar -czf file-tui-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz file-tui${{ matrix.ext }}
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: file-tui-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            file-tui-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            file-tui-${{ matrix.goos }}-${{ matrix.goarch }}.zip

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: file-tui-*
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}